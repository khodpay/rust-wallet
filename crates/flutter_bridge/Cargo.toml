[package]
name = "khodpay-flutter-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["KhodPay Team"]
license = "MIT OR Apache-2.0"
description = "Flutter Rust Bridge for KhodPay Wallet"
repository = "https://github.com/khodpay/rust-wallet"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]  # cdylib/staticlib for Flutter FFI; rlib for integration tests
name = "khodpay_flutter_bridge"

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.11.1"

# Local crates - your wallet functionality
khodpay-bip32 = { version = "0.2.0", path = "../bip32" }
khodpay-bip39 = { version = "0.4.0", path = "../bip39" }
khodpay-bip44 = { version = "0.1.0", path = "../bip44" }
khodpay-signing = { version = "0.2.0", path = "../khodpay-signing", features = ["erc4337"] }
khodpay-mpc-tss = { version = "0.1.0", path = "../mpc-tss" }

# Optional: For serializable structs
serde = { version = "1", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Ensure proper entropy on mobile platforms
getrandom = "0.2"

# Hex encoding
hex = "0.4"

[dev-dependencies]
# Enables run_local / trusted_dealer helpers for the MPC integration test
khodpay-mpc-tss = { version = "0.1.0", path = "../mpc-tss", features = ["test-utils"] }
# For 2-party ceremony simulation (pulled in transitively via test-utils, but explicit here for clarity)
cggmp21 = { version = "=0.6.3", features = ["curve-secp256k1", "spof"] }
# For serialising KeyShare → DeviceShare bytes in integration tests
serde_json = "1.0"

[profile.release]
opt-level = 3          # Maximum optimizations
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols for smaller binary
panic = "abort"        # Smaller binary size
