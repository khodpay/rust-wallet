[package]
name = "khodpay-flutter-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["KhodPay Team"]
license = "MIT OR Apache-2.0"
description = "Flutter Rust Bridge for KhodPay Wallet"
repository = "https://github.com/khodpay/rust-wallet"

[lib]
crate-type = ["cdylib", "staticlib"]  # For Flutter FFI
name = "khodpay_flutter_bridge"

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.11.1"

# Local crates - wallet functionality
khodpay-bip32    = { version = "0.2.0", path = "../bip32" }
khodpay-bip39    = { version = "0.4.0", path = "../bip39" }
khodpay-bip44    = { version = "0.1.0", path = "../bip44" }
khodpay-signing  = { version = "0.2.0", path = "../khodpay-signing", features = ["erc4337"] }
khodpay-mpc-tss  = { version = "0.1.0", path = "../mpc-tss" }

# MPC protocol primitives — versions must match khodpay-mpc-tss's own deps
cggmp21     = { version = "=0.6.3", features = ["curve-secp256k1"] }
round-based = { version = "0.4.1", features = ["state-machine"] }
sha2        = { version = "0.10" }
sha3        = { version = "0.10" }
rand        = { version = "0.8", features = ["std"] }
zeroize     = { version = "1.7", features = ["derive"] }
serde_json  = { version = "1.0" }
k256        = { version = "0.13", features = ["ecdsa"] }

# Serialisation
serde = { version = "1", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Ensure proper entropy on mobile platforms
getrandom = "0.2"

# Hex encoding
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
